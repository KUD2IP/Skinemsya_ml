[project]
name = "skinemsya-ml"
version = "0.1.0"
description = "ML-сервис распознавания чеков для «Скинемся»: POST /api/v1/recognize -> JSON по контракту бека"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    # NumPy 2.1+ Linux wheels требуют x86-64-v2 (SSE4.2).
    # Дешёвые VPS часто на v1 — иначе RuntimeError при import numpy.
    "numpy>=1.26,<2.1",
    "opencv-python-headless>=4.10",
    "rapidocr>=3.0",
    "onnxruntime>=1.18",
    "pillow>=10.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
train = [
    "requests>=2.31",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
