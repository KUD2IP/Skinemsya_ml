name: Deploy ML to production
description: Sync deploy files, pull image, health check with rollback

inputs:
  version:
    description: Semver version to deploy
    required: true
  production_env:
    description: Multiline production .env contents
    required: true
  ssh_private_key:
    description: SSH private key
    required: true
  production_host:
    description: Production VPS host
    required: true
  production_user:
    description: SSH user
    required: true
  production_ssh_port:
    description: SSH port
    required: false
    default: '22'
  ssh_known_hosts:
    description: Optional known_hosts entries
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Prepare deploy .env
      uses: ./.github/actions/prepare-deploy-env
      with:
        env_secret: ${{ inputs.production_env }}
        app_version: ${{ inputs.version }}
        ghcr_owner: ${{ github.repository_owner }}

    - name: Setup SSH
      id: ssh
      uses: ./.github/actions/setup-ssh
      with:
        host: ${{ inputs.production_host }}
        user: ${{ inputs.production_user }}
        port: ${{ inputs.production_ssh_port }}
        private_key: ${{ inputs.ssh_private_key }}
        known_hosts: ${{ inputs.ssh_known_hosts }}

    - name: Free disk, remember previous version, sync deploy files
      shell: bash
      env:
        PRODUCTION_HOST: ${{ inputs.production_host }}
        PRODUCTION_USER: ${{ inputs.production_user }}
        SSH_OPTS: ${{ steps.ssh.outputs.ssh_opts }}
        DEPLOY_PATH: /opt/skinemsya/deploy/ml
        APP_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        ssh $SSH_OPTS "${PRODUCTION_USER}@${PRODUCTION_HOST}" \
          "DEPLOY_PATH=${DEPLOY_PATH} APP_VERSION=${APP_VERSION}" bash -s <<'EOSSH'
        set -euo pipefail
        mkdir -p "${DEPLOY_PATH}"

        echo "===== Disk before cleanup ====="
        df -h /
        docker system df || true

        # Старые слои ML/бека быстро забивают маленький VPS.
        docker container prune -f || true
        docker image prune -af || true
        docker builder prune -af || true
        docker network prune -f || true
        # Логи контейнера ML (json-file) тоже могут съесть диск.
        if docker inspect skinemsya-ml >/dev/null 2>&1; then
          log_path="$(docker inspect --format='{{.LogPath}}' skinemsya-ml 2>/dev/null || true)"
          if [ -n "${log_path}" ] && [ -f "${log_path}" ]; then
            sudo truncate -s 0 "${log_path}" 2>/dev/null || truncate -s 0 "${log_path}" 2>/dev/null || true
          fi
        fi
        sudo journalctl --vacuum-size=50M >/dev/null 2>&1 || true
        sudo apt-get clean >/dev/null 2>&1 || true

        echo "===== Disk after cleanup ====="
        df -h /
        docker system df || true

        # rsync .env + pull образа (~1–2 ГиБ слоёв) — без запаса ENOSPC неизбежен.
        avail_kb="$(df -Pk / | awk 'NR==2 {print $4}')"
        if [ "${avail_kb}" -lt 1572864 ]; then
          echo "ERROR: need at least ~1.5GiB free on / before deploy (have $((avail_kb/1024))MiB)." >&2
          echo "SSH to VPS and free space (docker images, logs, apt cache), then re-run." >&2
          df -h >&2
          docker system df -v >&2 || true
          exit 1
        fi

        PREVIOUS_FILE="${DEPLOY_PATH}/.previous-version"
        ENV_FILE="${DEPLOY_PATH}/.env"
        current_version=""
        if [ -f "${ENV_FILE}" ]; then
          current_version="$(grep -E '^APP_VERSION=' "${ENV_FILE}" | tail -1 | cut -d= -f2- || true)"
        fi
        if [ -n "${current_version}" ] && [ "${current_version}" != "${APP_VERSION}" ]; then
          printf '%s\n' "${current_version}" > "${PREVIOUS_FILE}"
          chmod 600 "${PREVIOUS_FILE}"
          echo "Saved previous version: ${current_version}"
        else
          echo "No previous version to save (current='${current_version}', target='${APP_VERSION}')"
        fi
        EOSSH
        rsync -avz -e "ssh $SSH_OPTS" \
          --exclude '.previous-version' \
          deploy/ "${PRODUCTION_USER}@${PRODUCTION_HOST}:${DEPLOY_PATH}/"

    - name: Deploy with health check and rollback
      shell: bash
      env:
        PRODUCTION_HOST: ${{ inputs.production_host }}
        PRODUCTION_USER: ${{ inputs.production_user }}
        SSH_OPTS: ${{ steps.ssh.outputs.ssh_opts }}
        APP_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        ssh $SSH_OPTS "${PRODUCTION_USER}@${PRODUCTION_HOST}" \
          "APP_VERSION=${APP_VERSION}" bash -s <<'EOSSH'
        set -euo pipefail
        DEPLOY_PATH="/opt/skinemsya/deploy/ml"
        ENV_FILE="${DEPLOY_PATH}/.env"
        PREVIOUS_FILE="${DEPLOY_PATH}/.previous-version"
        HEALTH_URL="http://127.0.0.1:8001/healthz"
        READY_URL="http://127.0.0.1:8001/readyz"

        chmod 600 "${ENV_FILE}"

        cd "${DEPLOY_PATH}"
        # Логин в GHCR нужен один раз на сервере (docker login ghcr.io).
        compose() {
          docker compose --env-file "${ENV_FILE}" -f docker-compose.prod.yml "$@"
        }
        APP_VERSION="${APP_VERSION}" compose pull ml
        APP_VERSION="${APP_VERSION}" compose up -d --force-recreate ml
        # Сразу после recreate убираем висящие слои от предыдущего тега.
        docker image prune -af || true

        rollback() {
          if [ ! -f "${PREVIOUS_FILE}" ]; then
            echo "No previous version to rollback." >&2
            return 1
          fi
          prev="$(cat "${PREVIOUS_FILE}")"
          echo "Rolling back to ${prev}..."
          if grep -q '^APP_VERSION=' "${ENV_FILE}"; then
            sed -i "s/^APP_VERSION=.*/APP_VERSION=${prev}/" "${ENV_FILE}"
          else
            echo "APP_VERSION=${prev}" >> "${ENV_FILE}"
          fi
          cd "${DEPLOY_PATH}"
          APP_VERSION="${prev}" compose pull ml
          APP_VERSION="${prev}" compose up -d --force-recreate ml
        }

        dump_diagnostics() {
          echo "===== docker ps =====" >&2
          docker ps -a --filter name=skinemsya-ml >&2 || true
          echo "===== docker logs (tail 200) =====" >&2
          docker logs --tail 200 skinemsya-ml >&2 || true
          echo "===== docker inspect (OOM/State) =====" >&2
          docker inspect skinemsya-ml --format \
            'Status={{.State.Status}} ExitCode={{.State.ExitCode}} OOMKilled={{.State.OOMKilled}} Error={{.State.Error}}' \
            >&2 || true
          echo "===== free -h =====" >&2
          free -h >&2 || true
        }

        # 1) Процесс должен начать слушать порт (секунды).
        ok=0
        for i in $(seq 1 24); do
          if curl -fsS "${HEALTH_URL}" >/dev/null 2>&1; then
            ok=1
            break
          fi
          echo "Liveness attempt ${i}/24..."
          sleep 5
        done
        if [ "${ok}" -ne 1 ]; then
          echo "Liveness (/healthz) failed for version ${APP_VERSION}" >&2
          dump_diagnostics
          rollback || true
          exit 1
        fi
        echo "Liveness OK — waiting for OCR readiness..."

        # 2) OCR прогрев на слабом CPU может занять несколько минут.
        ok=0
        for i in $(seq 1 60); do
          if curl -fsS "${READY_URL}" >/dev/null 2>&1; then
            ok=1
            break
          fi
          echo "Readiness attempt ${i}/60..."
          # Если контейнер умер (OOM) — нет смысла ждать дальше.
          if ! docker ps --filter name=skinemsya-ml --filter status=running -q | grep -q .; then
            echo "Container is not running." >&2
            break
          fi
          sleep 5
        done

        if [ "${ok}" -ne 1 ]; then
          echo "Readiness (/readyz) failed for version ${APP_VERSION}" >&2
          dump_diagnostics
          rollback || true
          exit 1
        fi

        docker image prune -f
        echo "Deployed ML version ${APP_VERSION} successfully."
        EOSSH
