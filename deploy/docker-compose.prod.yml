# Production ML stack (тот же VPS, что и бек).
# deploy/.env создаётся GitHub Actions из environment secret PRODUCTION_ENV.
#
# Бек и ML в одной docker-сети `skinemsya_default` (проект бека `name: skinemsya`).
# В PRODUCTION_ENV бека:
#   ML_SERVICE_URL=http://skinemsya-ml:8000
#
# НЕ используй http://172.17.0.1:8001 при публикации 127.0.0.1:8001 —
# с контейнера бека до localhost-биндинга хоста трафик не доходит.
#
# Порт 8001 на localhost — только для healthcheck деплоя с хоста / отладки.

name: skinemsya-ml

services:
  ml:
    image: ghcr.io/${GHCR_OWNER}/skinemsya-ml:${APP_VERSION:?set APP_VERSION}
    pull_policy: always
    container_name: skinemsya-ml
    restart: unless-stopped
    ports:
      - '127.0.0.1:8001:8000'
    networks:
      - default
      - skinemsya
    environment:
      ML_OCR_THREADS: ${ML_OCR_THREADS:-1}
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      # Опционально: дообученная модель (смонтировать volume и раскомментировать)
      # ML_REC_MODEL_PATH: /custom/receipt_rec.onnx
      # ML_REC_KEYS_PATH: /custom/receipt_keys.txt
    # volumes:
    #   - ./models:/custom:ro
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8000/healthz']
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 120s
    # На 1 ГБ VPS лимит 768M часто даёт OOM при загрузке ONNX → рестарт-луп.
    # Нужен swap (1–2 ГБ) на VPS, иначе лучше не крутить бек+ML на одной 1 ГБ машине.
    deploy:
      resources:
        limits:
          memory: 950M

networks:
  skinemsya:
    external: true
    name: skinemsya_default
